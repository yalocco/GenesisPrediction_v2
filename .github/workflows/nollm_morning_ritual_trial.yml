name: NoLLM Morning Ritual Trial

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date YYYY-MM-DD (optional)"
        required: false
        default: ""
      skip_fx:
        description: "Skip FX phase for trial stability"
        required: false
        default: "false"
      skip_refresh_latest_artifacts:
        description: "Skip refresh_latest_artifacts phase"
        required: false
        default: "false"

jobs:
  nollm-trial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Resolve run date
        id: resolvedate
        shell: pwsh
        run: |
          $inputDate = "${{ github.event.inputs.target_date }}"
          if ([string]::IsNullOrWhiteSpace($inputDate)) {
            $resolved = Get-Date -Format "yyyy-MM-dd"
          } else {
            $resolved = $inputDate
          }
          "resolved_date=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved run date: $resolved"

      - name: Create minimal .env for docker compose and FX
        shell: bash
        run: |
          {
            echo "NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}"
            echo "NEWS_QUERY=world politics"
            echo "NEWS_LANG=en"
            echo "NEWS_PAGE_SIZE=50"
            echo "ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}"
            echo "EXCHANGERATE_HOST_ACCESS_KEY=${{ secrets.EXCHANGERATE_HOST_ACCESS_KEY }}"
            echo "TZ=Asia/Tokyo"
          } > .env
          test -s .env
          grep -q '^NEWSAPI_KEY=' .env
          grep -q '^ALPHAVANTAGE_API_KEY=' .env
          echo "[OK] minimal .env created"

      - name: Docker compose sanity check
        run: |
          docker compose version

      - name: Run NoLLM Morning Ritual
        shell: pwsh
        run: |
          ./scripts/run_morning_ritual.ps1 `
            -Date "${{ steps.resolvedate.outputs.resolved_date }}" `
            -NoLLM

      - name: Collect trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nollm-trial-artifacts
          path: |
            analysis/
            data/world_politics/analysis/
