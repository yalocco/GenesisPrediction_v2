name: NoLLM Morning Ritual Trial

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Target date YYYY-MM-DD. Leave empty to use runner local date."
        required: false
        default: ""
      skip_fx:
        description: "Skip FX phase for trial stability"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_refresh:
        description: "Skip refresh_latest_artifacts phase"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  nollm-trial:
    name: Run NoLLM Morning Ritual Trial
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      GENESIS_ACTIONS_TRIAL: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found; continuing with base Python."
          fi

      - name: Prepare PowerShell compatibility
        shell: bash
        run: |
          command -v pwsh
          sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          powershell -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Prepare minimal .env for docker compose
        shell: bash
        run: |
          if [ ! -f .env ]; then
            cat > .env <<'EOF'
          TZ=Asia/Tokyo
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}
          EOF
          fi
          sed -i 's/^          //' .env
          echo ".env prepared for trial."

      - name: Docker compose sanity check
        shell: bash
        run: |
          docker --version
          docker compose version
          docker compose config >/tmp/genesis_compose_config.txt
          tail -n 80 /tmp/genesis_compose_config.txt

      - name: Run NoLLM Morning Ritual
        shell: pwsh
        run: |
          $argsList = @("-NoLLM")

          if ("${{ github.event.inputs.run_date }}" -ne "") {
            $argsList += @("-Date", "${{ github.event.inputs.run_date }}")
          }

          if ("${{ github.event.inputs.skip_fx }}" -eq "true") {
            $argsList += "-SkipFx"
          }

          if ("${{ github.event.inputs.skip_refresh }}" -eq "true") {
            $argsList += "-SkipRefresh"
          }

          Write-Host "Running: scripts/run_morning_ritual.ps1 $($argsList -join ' ')"
          ./scripts/run_morning_ritual.ps1 @argsList

      - name: Verify NoLLM mode left no Ollama container dependency
        if: always()
        shell: bash
        run: |
          echo "Checking for Ollama container logs if any container exists..."
          docker ps -a || true
          if docker ps -a --format '{{.Names}}' | grep -q '^ollama-docker$'; then
            docker logs ollama-docker --since 10m || true
          else
            echo "No ollama-docker container present on GitHub runner. Good."
          fi

      - name: Collect trial artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p _trial_artifacts
          cp -R analysis _trial_artifacts/analysis 2>/dev/null || true
          cp -R data/world_politics/analysis _trial_artifacts/world_politics_analysis 2>/dev/null || true
          cp -R data/digest _trial_artifacts/digest 2>/dev/null || true
          cp -R data/prediction _trial_artifacts/prediction_data 2>/dev/null || true
          git status --short > _trial_artifacts/git_status_short.txt || true
          find _trial_artifacts -maxdepth 3 -type f | sort > _trial_artifacts/artifact_file_list.txt || true

      - name: Upload trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-nollm-trial-artifacts
          path: _trial_artifacts
          if-no-files-found: warn
          retention-days: 7
