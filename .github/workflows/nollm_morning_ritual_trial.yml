name: NoLLM Morning Ritual Trial

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date YYYY-MM-DD (optional)"
        required: false
        default: ""
      skip_fx:
        description: "Skip FX phase for trial stability"
        required: false
        default: "false"
      skip_refresh_latest_artifacts:
        description: "Skip refresh_latest_artifacts phase"
        required: false
        default: "false"

jobs:
  nollm-trial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare PowerShell compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Resolve run date
        id: resolvedate
        shell: pwsh
        run: |
          $inputDate = "${{ github.event.inputs.target_date }}"
          if ([string]::IsNullOrWhiteSpace($inputDate)) {
            $resolved = Get-Date -Format "yyyy-MM-dd"
          } else {
            $resolved = $inputDate
          }
          "resolved_date=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved run date: $resolved"

      - name: Run NoLLM Morning Ritual
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_morning_ritual.ps1 `
            -Date "${{ steps.resolvedate.outputs.resolved_date }}" `
            -NoLLM

      - name: Collect trial artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nollm-trial-artifacts
          path: |
            analysis/
            data/world_politics/analysis/
